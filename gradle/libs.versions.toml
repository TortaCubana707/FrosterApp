[versions]
agp = "9.4.1"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
coreKtx = "1.17.0"
datastore = "1.1.7"
lifecycle = "2.9.4"
coroutines = "1.10.2"
paho = "1.2.5"
firebaseBom = "34.18.0"
room = "2.8.5"
ksp = "2.3.12"
recyclerview = "1.4.0"
testRunner = "1.7.0"
extJunit = "1.3.0"
junit = "4.13.2"

[libraries]
appcompat        = { group = "androidx.appcompat",        name = "appcompat",            version.ref = "appcompat" }
material         = { group = "com.google.android.material", name = "material",           version.ref = "material" }
activity-ktx     = { group = "androidx.activity",         name = "activity-ktx",         version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout",     version.ref = "constraintlayout" }
core-ktx         = { group = "androidx.core",             name = "core-ktx",             version.ref = "coreKtx" }
datastore-preferences = { group = "androidx.datastore",   name = "datastore-preferences", version.ref = "datastore" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
coroutines-android = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
paho-mqtt        = { group = "org.eclipse.paho",          name = "org.eclipse.paho.client.mqttv3", version.ref = "paho" }
firebase-bom     = { group = "com.google.firebase",      name = "firebase-bom",         version.ref = "firebaseBom" }
firebase-database = { group = "com.google.firebase",     name = "firebase-database" }
firebase-auth    = { group = "com.google.firebase",      name = "firebase-auth" }
room-runtime     = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx         = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler    = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing     = { group = "androidx.room", name = "room-testing", version.ref = "room" }
recyclerview     = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
test-runner      = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
ext-junit        = { group = "androidx.test.ext", name = "junit", version.ref = "extJunit" }
junit            = { group = "junit",                     name = "junit",                version.ref = "junit" }
json             = { group = "org.json", name = "json", version = "20240303" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
